services:
  baserow:
    image: baserow/baserow:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL}
      SECRET_KEY: ${BASEROW_SECRET_KEY}
      BASEROW_EXTRA_ALLOWED_HOSTS: ${CRM_DOMAIN}
      # Use the embedded Postgres/Redis inside the official all-in-one image.
      # Persistent data is stored in the named Docker volume below.
    volumes:
      - baserow_data:/baserow/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.salvador-lead-crm.rule=Host(`${CRM_DOMAIN}`)"
      - "traefik.http.routers.salvador-lead-crm.entrypoints=websecure"
      - "traefik.http.routers.salvador-lead-crm.tls=true"
      - "traefik.http.routers.salvador-lead-crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.salvador-lead-crm.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/_health/ || curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  baserow_data:
